<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDOf3aLq2gFJSr3ThRgeFLFu-VYc49ihW4",
    authDomain: "crowley-football.firebaseapp.com",
    databaseURL: "https://crowley-football-default-rtdb.firebaseio.com",
    projectId: "crowley-football",
    storageBucket: "crowley-football.firebasestorage.app",
    messagingSenderId: "56102489603",
    appId: "1:56102489603:web:1a81953b6dd0d2fb84c836",
  };

  // Where the checklist dashboard lives, used for the link button below.
  // This file becomes the main entry point (index.html). The checklist app
  // lives alongside it in the same folder as checklist.html, so a relative
  // path works no matter what the site's domain/username is.
  const CHECKLIST_APP_URL = "checklist.html";

  // ==========================================================================
  // INVOICE EMAIL SETUP — one-time, ~5 minutes
  // Static pages can't send email directly, so invoices route through
  // Formspree (free), which forwards form submissions straight to an inbox.
  //
  // 1. Go to https://formspree.io and sign up free (any email works to log in
  //    with, this does NOT need to be invoices.advmedia@gmail.com).
  // 2. Click "+ New Form". Name it anything (e.g. "CISD Invoices").
  // 3. Under the form's settings, set the recipient email to:
  //        invoices.advmedia@gmail.com
  //    Formspree will send a one-time confirmation link to that inbox,
  //    someone with access to invoices.advmedia@gmail.com needs to click it
  //    once before submissions will actually deliver.
  // 4. Copy the form's endpoint URL (looks like https://formspree.io/f/xxxxxxxx)
  //    and paste it below, replacing the placeholder.
  // ==========================================================================
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/meeybjgp";
  const INVOICE_RECIPIENT = "invoices.advmedia@gmail.com";

  window.__fbReady = false;
  window.__fbLoadFailed = false;

  function loadScriptWithFallbacks(urls) {
    return new Promise((resolve, reject) => {
      let i = 0;
      function tryNext() {
        if (i >= urls.length) { reject(new Error("All sources failed for this script")); return; }
        const url = urls[i++];
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => resolve(url);
        s.onerror = () => { console.warn("Failed to load", url, "trying next source\u2026"); tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  const APP_SOURCES = [
    "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js",
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js",
    "https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js",
  ];
  const DB_SOURCES = [
    "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-database-compat.min.js",
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js",
    "https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-database-compat.js",
  ];

  window.__fbLoadPromise = loadScriptWithFallbacks(APP_SOURCES)
    .then(() => loadScriptWithFallbacks(DB_SOURCES))
    .then(() => { window.__fbReady = true; })
    .catch((e) => { console.error("Firebase library failed to load from every source:", e); window.__fbLoadFailed = true; });
</script>

  .log-duration { margin-left: auto; font-family: monospace; color: var(--green); font-weight: 700; }
</style>

<body>
<div class="wrap" id="app">
  <div class="header-row">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A8FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <h1>CISD Broadcast Time Clock</h1>
  </div>
  <p class="subhead">Clock in and out for your shift — no login needed. Shared with the whole crew.</p>
  <div id="setupWarning" class="setup-warning"></div>

  <a class="dash-link-btn" id="dashLinkBtn" href="#" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>

  </a>

  <div class="tabs">

  </div>

    <select id="gameSelect"></select>
  </div>

  <div id="viewRoot"><div class="empty-note">Connecting…</div></div>
</div>

<script>
// ============================================================================
// Data
// ============================================================================
const GAMES = [
  { id: "2026-08-27", day: "Thu", date: "8/27", opp: "Tx. Wesleyan vs Central Oklahoma" },
  { id: "2026-08-28", day: "Fri", date: "8/28", opp: "NCHS vs Aledo" },
  { id: "2026-09-03", day: "Thu", date: "9/3", opp: "CHS vs Lamar (Arlington)" },
  { id: "2026-09-04", day: "Fri", date: "9/4", opp: "NCHS vs Southlake Carroll" },
  { id: "2026-09-11", day: "Fri", date: "9/11", opp: "NCHS vs Summer Creek" },
  { id: "2026-09-12", day: "Sat", date: "9/12", opp: "Tx. Wesleyan vs Texas College" },
  { id: "2026-09-18", day: "Fri", date: "9/18", opp: "CHS vs Skyline" },
  { id: "2026-09-25", day: "Fri", date: "9/25", opp: "NCHS vs Crowley" },
  { id: "2026-09-26", day: "Sat", date: "9/26", opp: "Tx. Wesleyan vs Nelson University" },
  { id: "2026-10-09", day: "Fri", date: "10/9", opp: "CHS vs Red Oak" },
  { id: "2026-10-16", day: "Fri", date: "10/16", opp: "NCHS vs Lake Ridge" },
  { id: "2026-10-17", day: "Sat", date: "10/17", opp: "Tx. Wesleyan vs Mary Hardin-Baylor" },
  { id: "2026-10-23", day: "Fri", date: "10/23", opp: "CHS vs Mansfield" },
  { id: "2026-10-30", day: "Fri", date: "10/30", opp: "CHS vs Waxahachie" },
  { id: "2026-10-31", day: "Sat", date: "10/31", opp: "Tx. Wesleyan vs Oklahoma Panhandle State" },
  { id: "2026-11-05", day: "Thu", date: "11/5", opp: "NCHS vs Red Oak" },
];

const POSITION_LABELS = [
  "EIC", "PM", "Director", "Producer", "Shader", "Clips", "Replay",
  "Camera Lead", "Camera Operator", "Audio A1", "A2", "Utility",
];

function clockPath(gameId) { return `clock/${gameId}`; }

// ============================================================================
// Firebase setup (mirrors broadcast-checklist.html)
// ============================================================================
let dbReady = false;
let db = null;

function showSetupWarning(message) {
  const el = document.getElementById("setupWarning");
  if (message) el.innerHTML = message;
  el.style.display = "block";
}

async function initFirebaseAndBoot() {
  try {
    await window.__fbLoadPromise;
    if (window.__fbLoadFailed || typeof firebase === "undefined") {
      showSetupWarning("⚠️ Firebase's library failed to load from every source tried (usually a network or connection issue). Try reloading the page.");
    } else if (!FIREBASE_CONFIG.apiKey.startsWith("PASTE_")) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      dbReady = true;
    } else {
      showSetupWarning("⚠️ This file still has placeholder Firebase values. Use the same FIREBASE_CONFIG values as broadcast-checklist.html.");
    }
  } catch (e) {
    showSetupWarning("⚠️ Couldn't connect to the database (" + (e && e.message ? e.message : "unknown error") + ").");
    console.error(e);
    dbReady = false;
    db = null;
  }
  populateGameSelect();
  updateTabs();
  renderView();
}

function dbPush(path, value) {
  if (!db) { console.warn("Firebase not configured yet — not saved:", path); return; }
  return db.ref(path).push(value);
}
function dbUpdate(path, value) {
  if (!db) { console.warn("Firebase not configured yet — not saved:", path); return; }
  db.ref(path).update(value).catch((err) => {
    console.error("Firebase write error on", path, err);
    showSetupWarning("⚠️ Couldn't save that change (" + (err && err.code ? err.code : "unknown error") + "). Check the Realtime Database rules are published as open read/write.");
  });
}
function dbListen(path, cb) {
  if (!db) { cb(null); return () => {}; }
  const ref = db.ref(path);
  ref.on("value",
    (snap) => cb(snap.val()),
    (err) => {
      console.error("Firebase read error on", path, err);
      showSetupWarning("⚠️ Couldn't read from the database (" + (err && err.code ? err.code : "unknown error") + "). Make sure the Realtime Database rules are published as open read/write.");
    }
  );
  return () => ref.off("value");
}

// ============================================================================
// State
// ============================================================================
function nextUpcomingGameId() {
  const today = new Date(); today.setHours(0,0,0,0);
  for (const g of GAMES) { if (new Date(g.id + "T00:00:00") >= today) return g.id; }
  return GAMES[GAMES.length - 1].id;
}

const state = {
  view: "clock",
  gameId: nextUpcomingGameId(),
  name: "",
  position: POSITION_LABELS[0],
  justClockedIn: false,
};
let unsubClock = null;
let unsubInvoiceLog = null;

document.getElementById("tabClock").onclick = () => { state.view = "clock"; updateTabs(); renderView(); };
document.getElementById("tabInvoice").onclick = () => { state.view = "invoice"; updateTabs(); renderView(); };
function updateTabs() {
  document.getElementById("tabClock").classList.toggle("active", state.view === "clock");
  document.getElementById("tabInvoice").classList.toggle("active", state.view === "invoice");
}

function populateGameSelect() {
  const sel = document.getElementById("gameSelect");
  sel.innerHTML = GAMES.map((g) => `<option value="${g.id}">${g.day} ${g.date} — ${g.opp}</option>`).join("");
  sel.value = state.gameId;
  sel.onchange = () => { state.gameId = sel.value; state.justClockedIn = false; renderView(); };

  const dashBtn = document.getElementById("dashLinkBtn");
  dashBtn.href = CHECKLIST_APP_URL + "?view=dashboard&game=" + encodeURIComponent(state.gameId);
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function fmtDuration(inIso, outIso) {
  const ms = new Date(outIso) - new Date(inIso);
  const mins = Math.round(ms / 60000);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

function invoicePath(gameId) { return `invoices/${gameId}`; }

// ============================================================================
// Render
// ============================================================================
function renderView() {
  if (unsubClock) { unsubClock(); unsubClock = null; }
  if (unsubInvoiceLog) { unsubInvoiceLog(); unsubInvoiceLog = null; }
  const root = document.getElementById("viewRoot");
  root.innerHTML = `<div class="empty-note">Loading…</div>`;

  const dashBtn = document.getElementById("dashLinkBtn");
  dashBtn.href = CHECKLIST_APP_URL + "?view=dashboard&game=" + encodeURIComponent(state.gameId);

  if (state.view === "clock") {
    unsubClock = dbListen(clockPath(state.gameId), (val) => {
      renderClockUI(val || {});
    });
  } else {
    unsubInvoiceLog = dbListen(invoicePath(state.gameId), (val) => {
      renderInvoiceUI(val || {});
    });
  }
}

function renderClockUI(entries) {
  const root = document.getElementById("viewRoot");
  const currentGame = GAMES.find((g) => g.id === state.gameId);
  const now = new Date();

  const activeEntries = Object.entries(entries).filter(([, e]) => e.clockInAt && !e.clockOutAt);
  const completedEntries = Object.entries(entries)
    .filter(([, e]) => e.clockInAt && e.clockOutAt)
    .sort((a, b) => new Date(b[1].clockOutAt) - new Date(a[1].clockOutAt));

  let html = ``;

  if (state.justClockedIn) {
    html += `
      <div class="invoice-success" style="text-align:left; padding:16px;">
        <div style="margin-bottom:10px;">✓ You're clocked in. Next, head to the Broadcast Checklist to run your Pre-Shift checklist.</div>
        <a class="dash-link-btn" style="margin-bottom:0; background:var(--green); border-color:var(--green); color:#08170F" href="${CHECKLIST_APP_URL}?view=my&game=${encodeURIComponent(state.gameId)}">
          Continue to Broadcast Checklist →
        </a>
      </div>
    `;
  }

  html += `
    <div class="clock-card">
      <div class="clock-time">${now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}</div>
      <div class="clock-date">${currentGame.day} ${currentGame.date} — ${currentGame.opp}</div>

      <div class="field-block" style="text-align:left">
        <div class="label">Your Name</div>
        <input id="nameInput" placeholder="Type your name" value="${escapeAttr(state.name)}" />
      </div>
      <div class="field-block" style="text-align:left">
        <div class="label">Position</div>
        <select id="positionSelect">
          ${POSITION_LABELS.map((p) => `<option value="${p}" ${p === state.position ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>

      <button class="clock-btn in" id="clockInBtn" ${!state.name.trim() ? "disabled" : ""}>Clock In</button>
    </div>

    <div class="section-title">Currently Clocked In (${activeEntries.length})</div>
    <div class="roster-box">
  `;

  if (activeEntries.length === 0) {
    html += `<div class="empty-note">Nobody's clocked in for this game yet</div>`;
  } else {
    activeEntries.forEach(([key, e]) => {
      html += `
        <div class="roster-row">
          <div>
            <div class="roster-name">${escapeHtml(e.name)}</div>
            <div class="roster-pos">${escapeHtml(e.position)}</div>
          </div>
          <div class="roster-time">In: ${fmtTime(e.clockInAt)}</div>
          <button class="clock-out-btn" data-key="${key}">Clock Out</button>
        </div>
      `;
    });
  }
  html += `</div>`;

  html += `<div class="section-title">Completed Today</div><div class="roster-box">`;
  if (completedEntries.length === 0) {
    html += `<div class="empty-note">No completed shifts logged yet</div>`;
  } else {
    completedEntries.forEach(([, e]) => {
      html += `
        <div class="log-row">
          <div><strong>${escapeHtml(e.name)}</strong> · ${escapeHtml(e.position)}</div>
          <div class="log-duration">${fmtDuration(e.clockInAt, e.clockOutAt)}</div>
        </div>
      `;
    });
  }
  html += `</div>`;

  root.innerHTML = html;

  document.getElementById("nameInput").oninput = (e) => {
    state.name = e.target.value;
    document.getElementById("clockInBtn").disabled = !state.name.trim();
  };
  document.getElementById("positionSelect").onchange = (e) => { state.position = e.target.value; };
  document.getElementById("clockInBtn").onclick = () => {
    if (!state.name.trim()) return;
    dbPush(clockPath(state.gameId), {
      name: state.name.trim(),
      position: state.position,
      clockInAt: new Date().toISOString(),
      clockOutAt: null,
    });
    state.name = "";
    state.justClockedIn = true;
  };
  root.querySelectorAll(".clock-out-btn").forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      dbUpdate(`${clockPath(state.gameId)}/${key}`, { clockOutAt: new Date().toISOString() });
    };
  });
}
function escapeAttr(str) { return escapeHtml(str); }

function renderInvoiceUI(entries) {
  const root = document.getElementById("viewRoot");
  const currentGame = GAMES.find((g) => g.id === state.gameId);
  const notConfigured = FORMSPREE_ENDPOINT.includes("PASTE_YOUR_FORM_ID");

  const log = Object.entries(entries).sort((a, b) => new Date(b[1].submittedAt) - new Date(a[1].submittedAt));

  let html = `<div class="invoice-card">`;
  if (notConfigured) {
    html += `<div class="setup-warning" style="display:block">⚠️ Invoice email isn't connected yet. See the setup comment near the top of this file (search "INVOICE EMAIL SETUP") to hook up Formspree, it takes about 5 minutes.</div>`;
  }
  html += `
    <div class="field-block">
      <div class="label">Your Name</div>
      <input id="invNameInput" placeholder="Type your name" value="${escapeAttr(state.name)}" />
    </div>
    <div class="invoice-row">
      <div class="field-block">
        <div class="label">Position</div>
        <select id="invPositionSelect">
          ${POSITION_LABELS.map((p) => `<option value="${p}" ${p === state.position ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="field-block">
        <div class="label">Hours Worked</div>
        <input id="invHoursInput" type="number" min="0" step="0.25" placeholder="e.g. 4.5" />
      </div>
    </div>
    <div class="invoice-row">
      <div class="field-block">
        <div class="label">Rate ($/hr, optional)</div>
        <input id="invRateInput" type="number" min="0" step="0.01" placeholder="e.g. 20" />
      </div>
      <div class="field-block">
        <div class="label">Total ($, auto-fills if rate given)</div>
        <input id="invTotalInput" type="number" min="0" step="0.01" placeholder="e.g. 90" />
      </div>
    </div>
    <div class="field-block">
      <div class="label">Notes (optional)</div>
      <textarea id="invNotesInput" rows="3" placeholder="Anything invoices.advmedia@gmail.com should know"></textarea>
    </div>
    <div id="invoiceMsg"></div>
    <button class="submit-btn" id="invoiceSubmitBtn">Submit Invoice</button>
  `;
  html += `</div>`;

  html += `<div class="section-title">Submitted for This Game</div><div class="roster-box">`;
  if (log.length === 0) {
    html += `<div class="empty-note">No invoices submitted yet</div>`;
  } else {
    log.forEach(([, inv]) => {
      html += `
        <div class="invoice-log-row">
          <div class="invoice-log-top">
            <span>${escapeHtml(inv.name)} · ${escapeHtml(inv.position)}</span>
            <span>${inv.total ? "$" + Number(inv.total).toFixed(2) : (inv.hours ? inv.hours + " hrs" : "")}</span>
          </div>
          ${inv.notes ? `<div class="invoice-log-notes">${escapeHtml(inv.notes)}</div>` : ""}
        </div>
      `;
    });
  }
  html += `</div>`;

  root.innerHTML = html;

  const nameEl = document.getElementById("invNameInput");
  const posEl = document.getElementById("invPositionSelect");
  const hoursEl = document.getElementById("invHoursInput");
  const rateEl = document.getElementById("invRateInput");
  const totalEl = document.getElementById("invTotalInput");
  const notesEl = document.getElementById("invNotesInput");
  const msgEl = document.getElementById("invoiceMsg");
  const submitBtn = document.getElementById("invoiceSubmitBtn");

  nameEl.oninput = (e) => { state.name = e.target.value; };
  posEl.onchange = (e) => { state.position = e.target.value; };
  function recalcTotal() {
    const h = parseFloat(hoursEl.value);
    const r = parseFloat(rateEl.value);
    if (!isNaN(h) && !isNaN(r)) totalEl.value = (h * r).toFixed(2);
  }
  hoursEl.oninput = recalcTotal;
  rateEl.oninput = recalcTotal;

  submitBtn.onclick = async () => {
    const name = nameEl.value.trim();
    const position = posEl.value;
    const hours = hoursEl.value.trim();
    const rate = rateEl.value.trim();
    const total = totalEl.value.trim();
    const notes = notesEl.value.trim();

    if (!name) { msgEl.innerHTML = `<div class="setup-warning" style="display:block">Enter your name before submitting.</div>`; return; }
    if (!hours) { msgEl.innerHTML = `<div class="setup-warning" style="display:block">Enter hours worked before submitting.</div>`; return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";

    const payload = {
      name, position, hours, rate, total, notes,
      game: `${currentGame.day} ${currentGame.date} — ${currentGame.opp}`,
      _subject: `Invoice: ${name} (${position}) — ${currentGame.date}`,
      _replyto: undefined,
    };

    let emailOk = false;
    if (!FORMSPREE_ENDPOINT.includes("PASTE_YOUR_FORM_ID")) {
      try {
        const res = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload),
        });
        emailOk = res.ok;
        if (!res.ok) console.error("Formspree responded with an error:", await res.text());
      } catch (e) {
        console.error("Formspree submission failed:", e);
      }
    }

    // Always keep a record in the shared log, even if email delivery failed,
    // so nothing gets lost and PM/EIC can still see it here.
    dbPush(invoicePath(state.gameId), {
      name, position, hours, rate: rate || null, total: total || null, notes,
      submittedAt: new Date().toISOString(),
      emailSent: emailOk,
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Invoice";

    if (emailOk) {
      msgEl.innerHTML = `<div class="invoice-success">✓ Sent to ${INVOICE_RECIPIENT}</div>`;
    } else if (FORMSPREE_ENDPOINT.includes("PASTE_YOUR_FORM_ID")) {
      msgEl.innerHTML = `<div class="invoice-success" style="background:#3A1A17;border-color:var(--red);color:#FFB3AC">Saved to the shared log, but email isn't connected yet (see setup note above), so ${INVOICE_RECIPIENT} was not notified.</div>`;
    } else {
      msgEl.innerHTML = `<div class="invoice-success" style="background:#3A1A17;border-color:var(--red);color:#FFB3AC">Saved to the shared log, but the email couldn't be sent right now. Try again, or let Dustin/Aracely know.</div>`;
    }

    hoursEl.value = ""; rateEl.value = ""; totalEl.value = ""; notesEl.value = "";
  };
}

initFirebaseAndBoot();
setInterval(() => {
  const clockEl = document.querySelector(".clock-time");
  if (clockEl) clockEl.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
}, 1000);
</script>
</body>
</html>
