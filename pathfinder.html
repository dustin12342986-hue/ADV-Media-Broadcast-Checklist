<!-- ===========================================================================
     ADV MEDIA — PATHFINDER (standalone)
     ===========================================================================

     WHAT THIS IS

     The stadium signal finder, handed out on its own. Inside the crew app it is
     a tab; this page is the same thing behind a short link and an access code,
     for an EIC who does not have a crew login and does not need one.

     WHY A CODE AND NOT A LOGIN

     The record set names rooms, racks, jack numbers and where every cable
     lands in a school district's stadium. That is not secret, but it is not
     something to leave on an open URL either. A visiting EIC should be able to
     open a link on their phone in a truck at 5pm without being added to the
     crew roster first, so this is a code, not an account.

     The code is stored here as a SHA-256 hash, never in the clear. Anyone
     reading the source finds the hash, which does not give them the code.
     That is the honest limit of what a page with no server can do: it stops
     someone who was forwarded the link, not someone determined with the hash.
     Nothing behind it is worth more than that.

     CHANGING THE CODE

     Open this page with ?newcode=WHATEVER-YOU-WANT on the end of the URL. It
     prints the hash to paste over ACCESS_HASH below. The old code stops working
     the moment the new file is uploaded, which is also how you revoke it from
     someone who has left.

     WHAT IT NEEDS NEXT TO IT

     adv-theme.js and crowley-signal-finder.html. Two files, nothing else. No
     login, no database, no CDN.
     =========================================================================== -->

  /* ---- gate ---- */

    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 20px;

    width: 100%; max-width: 380px; background: var(--panel);

  .gate-logo { height: 42px; width: auto; display: block; margin: 0 auto 16px; }
  .gate h2 { font-size: 18px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .gate p {

    display: block; font-size: 11px; font-weight: 800; color: var(--text-faint);

    width: 100%; padding: 13px 14px; border-radius: 11px; font-size: 16px;

<script>
"use strict";

/* ---- what it opens ---- */
var FINDER_SRC = "crowley-signal-finder.html";

/* ---- the code ----------------------------------------------------------
   SHA-256 of the access code, upper-cased and trimmed. The code itself is
   nowhere in this file. To change it, open this page with ?newcode=NEW-CODE
   and paste what it prints over the line below.
   ---------------------------------------------------------------------- */
var ACCESS_HASH = "2f400ab511c60c7f11622d6edd48845c4e9137504ab460807498332c814c65b1";

var UNLOCK_KEY = "advPathfinderUnlocked";

/* ---- SHA-256 -----------------------------------------------------------
   Written out rather than pulled from crypto.subtle, which is only there on
   a secure origin. This page gets opened from a phone, off a USB stick and
   from a file:// path on a laptop in a truck, and a code box that silently
   fails on half of those is worse than no code box. No CDN either, same rule
   as the rest of the apps.
   ---------------------------------------------------------------------- */
var SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function sha256Hex(str) {
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  // UTF-8 bytes. Codes are ASCII in practice, but a pasted en dash should not
  // silently hash to something different than it looks.
  var bytes = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) { bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
    else if (c < 0xd800 || c >= 0xe000) { bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    else {
      i++;
      var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
      bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    }
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (var s = 56; s >= 0; s -= 8) bytes.push((bitLen / Math.pow(2, s)) & 0xff);

  var h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w = new Array(64);
  for (var b = 0; b < bytes.length; b += 64) {
    for (var t = 0; t < 16; t++) {
      w[t] = (bytes[b + t * 4] << 24) | (bytes[b + t * 4 + 1] << 16) |
             (bytes[b + t * 4 + 2] << 8) | bytes[b + t * 4 + 3];
    }
    for (t = 16; t < 64; t++) {
      var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    var a = h[0], bb = h[1], c2 = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
    for (t = 0; t < 64; t++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + SHA_K[t] + w[t]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var mj = (a & bb) ^ (a & c2) ^ (bb & c2);
      var t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0;
      d = c2; c2 = bb; bb = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + bb) | 0; h[2] = (h[2] + c2) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  return h.map(function (x) { return ("00000000" + (x >>> 0).toString(16)).slice(-8); }).join("");
}

function normalise(v) { return String(v == null ? "" : v).trim().toUpperCase(); }
function codeMatches(v) { return sha256Hex(normalise(v)) === ACCESS_HASH; }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function remembered() {
  try { return localStorage.getItem(UNLOCK_KEY) === ACCESS_HASH; } catch (e) { return false; }
}
function remember(on) {
  try {
    if (on) localStorage.setItem(UNLOCK_KEY, ACCESS_HASH);
    else localStorage.removeItem(UNLOCK_KEY);
  } catch (e) { /* private window; they retype it next visit */ }
}

var root = document.getElementById("root");

/* ---- the helper that lets him change the code without me --------------- */
function newCodeHelper() {
  var q = new URLSearchParams(location.search).get("newcode");
  if (!q) return false;
  var norm = normalise(q);
  root.innerHTML =
    '<div class="gate-wrap"><div class="gate">' +
      '<h2>New code</h2>' +
      '<p>Paste the line below over <code>ACCESS_HASH</code> in this file, then upload it. ' +
      'The old code stops working straight away.</p>' +
      '<label>The code</label>' +
      '<input readonly value="' + esc(norm) + '" />' +
      '<label style="margin-top:14px;">The line to paste</label>' +
      '<textarea readonly rows="3" style="width:100%;padding:12px;border-radius:11px;' +
        'background:var(--panel2);border:1px solid var(--border);color:var(--text);' +
        'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;">' +
        'var ACCESS_HASH = "' + sha256Hex(norm) + '";</textarea>' +
      '<div class="legal">Nothing was saved. This page only did the arithmetic.</div>' +
    '</div></div>';
  return true;
}

// Check the folder is there before framing it. Otherwise a missing folder
// frames the host's 404 page, and an EIC reading that concludes the link is
// dead rather than that a folder has not been uploaded.
function mountFrame() {
  var wrap = document.getElementById("frameWrap");
  function frameIt() {
    wrap.innerHTML = '<iframe id="pfFrame" title="Crowley stadium signal finder" src="' + FINDER_SRC + '"></iframe>';
  }
  try {
    fetch(FINDER_SRC, { method: "HEAD" }).then(function (res) {
      if (res.ok) return frameIt();
      wrap.innerHTML =
        '<div class="notice" style="margin:auto;">' +
          '<strong>The signal finder is not on the server yet.</strong><br />' +
          'Upload <code>crowley-signal-finder.html</code> next to this page. One file, nothing else.' +
        '</div>';
    }).catch(frameIt);
  } catch (e) {
    // No fetch at all, or a file:// path where the check cannot run. Frame it
    // and let the iframe have its own go rather than refusing on a guess.
    frameIt();
  }
}
