<!--
  ============================================================================
  ADV MEDIA TEAMS — CREW BOARD
  ============================================================================
  The lobby TV and the first screen of the app. Rotates through what the crew
  needs to know: next call, what's coming up, open shifts, gear status, the
  Bring a Show program, the Academy sign-up, shout-outs, season numbers.

  EVERYTHING ON IT IS LIVE. It reads the same Firebase nodes as
  adv-media-teams.html and listens for changes, so a shift picked up on a
  phone shows up on the TV within a second. Nothing on this page is sample
  data. A slide with nothing real to show is skipped, not faked.

    liveRoster, clientEvents, gameOverrides, gameSettings   schedule + crew
    cables, cases                                          gear slide
    crewBoard                                              NEW, see below
    profiles/{uid}, invoices, qbApprovals, paidStatus/{uid} "Your shift" slide,
                                                           signed-in phone only

  CREWBOARD NODE (new). Edited from this page by an admin (Edit board button):
    crewBoard/announcements/{push}  { text, at }        ticker
    crewBoard/shoutouts/{push}      { quote, from, at } shout-out slide
    crewBoard/referrals             { paidTotal, inProgress, booked }
    crewBoard/academy               { url }             QR code target
  Needs a rules entry, see firebase-rules.json.

  TWO MODES
    crew-board.html        phone. Shows "Your shift" if signed in, and the
                           Enter button into the app.
    crew-board.html?tv=1   lobby TV. No personal data, no buttons. Nothing
                           about any one person's pay ever shows in this mode.

  GAMES BELOW IS A COPY of the GAMES constant in adv-media-teams.html. Same
  rule as there: it is a seed. Moves, cancels and removals come from
  gameOverrides, so a copy that is behind on those still shows the truth.
  A brand new football game added to the file needs adding here too.
  ============================================================================
-->

<!-- Shared appearance. Must load before this page's own styles. -->
<script src="adv-theme.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body {
    font-family:var(--font); -webkit-tap-highlight-color:transparent;
    min-height:100vh; display:flex; flex-direction:column;
  }

  .top {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:clamp(14px,2vw,34px) clamp(16px,3vw,56px) 0;
  }
  .logo { height:clamp(44px,6.2vw,120px); width:auto; display:block; }
  /* The logo is black ink. Every dark theme flips it to white. */
  html:not([data-theme="light"]):not([data-theme="mono-light"]):not([data-theme$="-light"]) .logo { filter:invert(1); }
  .board-name {
    font-size:clamp(10.5px,0.9vw,16px); font-weight:800; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.6px; margin-top:4px;
  }
  .now { text-align:right; }
  .clock { font-size:clamp(26px,3.6vw,68px); font-weight:800; letter-spacing:-0.5px; line-height:1; }
  .date { color:var(--text-muted); font-size:clamp(12px,1.1vw,20px); margin-top:4px; }
  .wx { color:var(--text-muted); font-size:clamp(12px,1.1vw,20px); margin-top:3px; }

  .stage {
    flex:1; display:grid; padding:clamp(14px,2vw,34px) clamp(16px,3vw,56px);
    align-items:start; grid-template-columns:minmax(0,1fr); overflow-x:clip;
  }
  /* Every slide sits in the same grid cell, so the stage is as tall as the
     tallest one and nothing jumps when they swap. */
  .slide {
    grid-area:1/1; opacity:0; visibility:hidden; transform:translateX(24px);
    transition:opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
    display:flex; flex-direction:column; gap:clamp(12px,1.3vw,26px); min-width:0;
  }
  .slide.on {
    opacity:1; visibility:visible; transform:none;
    transition:opacity .6s ease, transform .6s ease, visibility 0s;
  }

  .kicker {
    font-size:clamp(11.5px,1vw,19px); font-weight:800; color:var(--accent);
    text-transform:uppercase; letter-spacing:0.6px;
  }
  .headline {
    font-family:Georgia,"Times New Roman",serif; font-weight:700;
    font-size:clamp(28px,4.2vw,84px); line-height:1.05; letter-spacing:-0.5px; margin:4px 0 0;
  }
  .sub { color:var(--text-muted); font-size:clamp(14px,1.35vw,26px); line-height:1.45; margin-top:6px; }

  .grid { display:grid; gap:clamp(10px,1vw,20px); grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:clamp(14px,1.4vw,28px); min-width:0;
  }
  .card.hi { border-color:var(--accent); }
  .label {
    font-size:clamp(11px,0.85vw,16px); font-weight:800; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;
  }
  .big { font-size:clamp(22px,2.6vw,50px); font-weight:800; line-height:1.1; letter-spacing:-0.3px; }
  .muted { color:var(--text-muted); font-size:clamp(13px,1.15vw,22px); margin-top:4px; line-height:1.4; }
  .money { font-size:clamp(40px,6vw,120px); font-weight:800; color:var(--accent); line-height:1; letter-spacing:-1px; }

  .rows { display:flex; flex-direction:column; }
  .row {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:clamp(9px,0.8vw,16px) 0; border-bottom:1px solid var(--border);
    font-size:clamp(14px,1.3vw,25px);
  }
  .row:last-child { border-bottom:0; }
  .row .r { color:var(--text-muted); text-align:right; }
  @media (max-width:600px) { .row { flex-wrap:wrap; } .row .r { text-align:left; } }
  .row .l { min-width:0; }

  .chips { display:flex; flex-wrap:wrap; gap:clamp(6px,0.5vw,10px); }
  .chip {
    font-size:clamp(12px,1vw,19px); font-weight:700; padding:clamp(5px,0.45vw,9px) clamp(9px,0.8vw,15px);
    border-radius:8px; background:var(--panel2); border:1px solid var(--border);
    display:inline-flex; align-items:center; gap:7px;
  }
  .chip .who { font-weight:500; color:var(--text-muted); }
  .chip.open { border-style:dashed; color:var(--text-muted); }
  .tag {
    font-size:clamp(10.5px,0.8vw,15px); font-weight:800; padding:3px 8px; border-radius:6px;
    text-transform:uppercase; letter-spacing:0.4px; background:var(--panel2);
    color:var(--text-faint); border:1px solid var(--border); white-space:nowrap;
  }
  .tag.acc { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .tag.good { background:var(--good-bg); color:var(--good-ink); border-color:transparent; }
  .tag.info { background:var(--info-bg); color:var(--info-ink); border-color:transparent; }
  .tag.bad { background:var(--bad-bg); color:var(--bad-ink); border-color:transparent; }

  .steps { display:grid; gap:clamp(8px,0.8vw,16px); grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); }
  .step { background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:clamp(10px,1vw,20px); }
  .step b { display:block; font-size:clamp(20px,2vw,40px); color:var(--accent); }
  .step span { font-size:clamp(13px,1.1vw,21px); color:var(--text-muted); line-height:1.35; }

  .quote {
    font-family:Georgia,"Times New Roman",serif; font-size:clamp(20px,2.4vw,46px);
    line-height:1.35; font-weight:700;
  }
  .qr { background:#fff; padding:12px; border-radius:12px; line-height:0; display:inline-block; }
  .qr svg { width:clamp(150px,15vw,300px); height:auto; display:block; }

  .empty { color:var(--text-faint); font-size:clamp(13px,1.15vw,22px); }

  .foot {
    display:flex; align-items:center; border-top:1px solid var(--border);
    min-height:clamp(42px,3.4vw,64px);
  }
  .dots { display:flex; gap:6px; padding:0 clamp(16px,3vw,56px); }
  .dots button {
    width:clamp(18px,1.8vw,34px); height:6px; border-radius:6px; border:0; padding:0;
    background:var(--border); cursor:pointer; overflow:hidden; position:relative;
  }
  .dots button i { position:absolute; inset:0; width:0; background:var(--accent); }
  .ticker {
    flex:1; overflow:hidden; white-space:nowrap; align-self:stretch; display:flex; align-items:center;
    border-left:1px solid var(--border);
  }
  .ticker-track {
    display:inline-flex; gap:56px; padding-left:100%;
    font-size:clamp(13px,1.2vw,23px); color:var(--text-muted);
    animation:tick var(--tick-s,50s) linear infinite;
  }
  .ticker-track b { color:var(--accent); font-weight:800; margin-right:8px; text-transform:uppercase; letter-spacing:0.4px; }
  @keyframes tick { to { transform:translateX(-100%); } }

  .enter-bar {
    display:flex; gap:10px; flex-wrap:wrap;
    padding:0 clamp(16px,3vw,56px) clamp(16px,2vw,30px);
  }
  .btn {
    flex:1; min-width:180px; text-align:center; text-decoration:none; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent);
    border-radius:12px; padding:14px 16px; font-size:15px; font-weight:800; font-family:inherit;
  }
  .btn.ghost { background:var(--panel); color:var(--text); border-color:var(--border); flex:0 1 auto; min-width:0; }
  @media (max-width:600px) { .enter-bar .btn:first-child { flex-basis:100%; } }
  body.tv .enter-bar, body.tv .adminOnly { display:none !important; }

  /* Admin editor */
  .ed-ov { position:fixed; inset:0; background:rgba(5,8,12,0.8); z-index:900; overflow:auto; padding:16px; display:none; }
  .ed-ov.open { display:block; }
  .ed { max-width:640px; margin:0 auto; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .ed h2 { margin:0 0 4px; font-size:19px; }
  .ed .label { margin-top:18px; }
  .ed input, .ed textarea {
    width:100%; font-size:16px; font-family:inherit; color:var(--text);
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-top:6px;
  }
  .ed textarea { min-height:70px; resize:vertical; }
  .ed .inline { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .ed .inline input { min-width:0; }
  .ed .item { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .ed .item span { flex:1; }
  .ed .x { background:none; border:1px solid var(--border); color:var(--text-muted); border-radius:8px; padding:4px 10px; cursor:pointer; font-family:inherit; }
  .ed .save { margin-top:10px; }
  .ed .msg { font-size:13px; color:var(--text-muted); margin-top:8px; min-height:18px; }
</style>
</head>

<script>
// ============================================================================
// Schedule seed. Copy of GAMES in adv-media-teams.html (see header comment).
// ============================================================================
const GAMES = [
  { id: "2026-08-27", day: "Thu", date: "8/27", opp: "Tx. Wesleyan vs Central Oklahoma",
    gameTime: "6:00 PM", call: "4:00 PM", roleCalls: { "Audio A2/Utility": "3:00 PM" } },
  { id: "2026-08-28", day: "Fri", date: "8/28", opp: "NCHS vs Aledo", gameTime: "7:00 PM" },
  { id: "2026-09-03", day: "Thu", date: "9/3", opp: "CHS vs Lamar (Arlington)" },
  { id: "2026-09-04", day: "Fri", date: "9/4", opp: "NCHS vs Southlake Carroll" },
  { id: "2026-09-11", day: "Fri", date: "9/11", opp: "NCHS vs Summer Creek" },
  { id: "2026-09-12", day: "Sat", date: "9/12", opp: "Tx. Wesleyan vs Texas College" },
  { id: "2026-09-18", day: "Fri", date: "9/18", opp: "CHS vs Skyline" },
  { id: "2026-09-25", day: "Fri", date: "9/25", opp: "NCHS vs Crowley" },
  { id: "2026-09-26", day: "Sat", date: "9/26", opp: "Tx. Wesleyan vs Nelson University" },
  { id: "2026-10-09", day: "Fri", date: "10/9", opp: "CHS vs Red Oak" },
  { id: "2026-10-16", day: "Fri", date: "10/16", opp: "NCHS vs Lake Ridge" },
  { id: "2026-10-17", day: "Sat", date: "10/17", opp: "Tx. Wesleyan vs Mary Hardin-Baylor" },
  { id: "2026-10-23", day: "Fri", date: "10/23", opp: "CHS vs Mansfield" },
  { id: "2026-10-30", day: "Fri", date: "10/30", opp: "CHS vs Waxahachie" },
  { id: "2026-10-31", day: "Sat", date: "10/31", opp: "Tx. Wesleyan vs Oklahoma Panhandle State" },
  { id: "2026-11-05", day: "Thu", date: "11/5", opp: "NCHS vs Red Oak" },
];

const TRADEABLE_ROLES = ["Director", "Producer", "Shader", "Clips", "Replay", "Camera 1", "Camera 2", "Camera 3", "Camera 4", "Audio A1", "Audio A2/Utility"];
const OVERRIDABLE = ["opp", "day", "date", "eventDate", "venue", "gameTime", "call",
  "callTime", "endTime", "roles", "cancelled", "cancelReason", "removed"];

const TV = /[?&]tv=1\b/.test(location.search);
if (TV) document.body.classList.add("tv");
document.getElementById("enterBtn").href = APP_URL;

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

// ---------------------------------------------------------------------------
// Live state. Each listener fills its slot and asks for a repaint.
// ---------------------------------------------------------------------------
const S = {
  liveRoster: {}, clientEvents: {}, gameOverrides: {}, gameSettings: {},
  cables: null, cases: null, board: {},
  user: null, profile: null, invoices: null, approvals: {}, paid: {},
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (m) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
const roleKey = (r) => String(r).replace(/[^A-Za-z0-9]/g, "_");

// Same as the app: local calendar dates, never UTC.
function localDateId(d) {
  const dt = d || new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}
function addDays(id, n) {
  const [y, m, d] = id.split("-").map(Number);
  return localDateId(new Date(y, m - 1, d + n));
}
function eventDateOf(g) { return (g && g.eventDate) || String(g && g.id).split("__")[0]; }
function prettyDate(id, long) {
  const [y, m, d] = id.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString([], long
    ? { weekday: "long", month: "long", day: "numeric" }
    : { weekday: "short", month: "short", day: "numeric" });
}

// Mirrors allShiftEvents() in the app.
function allEvents() {
  const built = [];
  GAMES.forEach((g) => {
    const base = { ...g, roles: TRADEABLE_ROLES, client: "CISD" };
    const ov = S.gameOverrides[g.id];
    if (ov) OVERRIDABLE.forEach((k) => { if (ov[k] !== undefined && ov[k] !== null) base[k] = ov[k]; });
    if (base.removed) return;
    built.push(base);
  });
  Object.entries(S.clientEvents || {}).forEach(([id, ev]) => {
    if (!ev) return;
    built.push({
      id, day: ev.day || "", date: ev.date || "", opp: ev.name || "Event",
      roles: Array.isArray(ev.roles) && ev.roles.length ? ev.roles : TRADEABLE_ROLES,
      client: ev.client || "Client", venue: ev.venue || "", callTime: ev.callTime || "",
      cancelled: !!ev.cancelled, eventDate: ev.eventDate || "",
    });
  });
  return built.sort((a, b) => eventDateOf(a).localeCompare(eventDateOf(b)) || String(a.id).localeCompare(String(b.id)));
}

// Mirrors callsFor(): a saved gameSettings record wins over the seed.
function callsFor(ev) {
  const saved = S.gameSettings[ev.id];
  if (saved) return { gameTime: saved.gameTime || "", call: saved.call || "" };
  return { gameTime: ev.gameTime || "", call: ev.call || ev.callTime || "" };
}

function venueOf(ev) {
  if (ev.venue) return ev.venue;
  return ev.client === "CISD" ? STADIUM_NAME : "";
}

// Crew on an event, straight from liveRoster. EIC and PM are not shift-board
// roles, same as the app's visible roster.
function crewFor(ev) {
  const r = S.liveRoster[ev.id];
  if (!r) return null;
  const out = [];
  (ev.roles || TRADEABLE_ROLES).forEach((role) => {
    if (role === "PM") return;
    const e = r[roleKey(role)];
    if (!e) return;
    const assigned = e.status === "assigned" && e.name;
    out.push({ role, name: assigned ? e.name : "", open: !assigned });
  });
  return out;
}

function upcoming() {
  const today = localDateId();
  return allEvents().filter((e) => !e.cancelled && eventDateOf(e) >= today);
}

// ---------------------------------------------------------------------------
// Name matching for the signed-in person. Same rules as namesMatch() in the
// app, so "Your shift" agrees with what the app shows them.
// ---------------------------------------------------------------------------
function normalizeName(s) { return (s || "").toLowerCase().replace(/[.,]/g, "").replace(/\s+/g, " ").trim(); }
function rosterAliases(n) {
  const raw = (n || "").trim(); if (!raw) return [];
  const m = raw.match(/^(.*?)\s*\((.*?)\)\s*$/);
  return (m ? [normalizeName(m[1]), normalizeName(m[2])] : [normalizeName(raw)]).filter(Boolean);
}
function namesMatch(rosterName, legalName, crewHandle) {
  const aliases = rosterAliases(rosterName); if (!aliases.length) return false;
  const handle = normalizeName(crewHandle);
  if (handle && aliases.includes(handle)) return true;
  const legal = normalizeName(legalName); if (!legal) return false;
  if (aliases.includes(legal)) return true;
  const parts = legal.split(" ").filter(Boolean);
  const first = parts[0], last = parts.length > 1 ? parts[parts.length - 1] : "";
  if (!first) return false;
  return aliases.some((a) => {
    const p = a.split(" ").filter(Boolean);
    if (p.length === 1) return p[0] === first;
    if (p[0] !== first || !last) return false;
    const aLast = p[p.length - 1];
    if (aLast === last) return true;
    return aLast.length === 1 && last.startsWith(aLast);
  });
}

// ---------------------------------------------------------------------------
// Slides. Each returns HTML, or null when it has nothing real to show.
// ---------------------------------------------------------------------------
function slideNext() {
  const ev = upcoming()[0];
  if (!ev) {
    return `<div><div class="kicker">Next call</div><h1 class="headline">Nothing on the board yet</h1>
      <div class="sub">New events show up here as soon as they're added in Teams.</div></div>`;
  }
  const c = callsFor(ev), crew = crewFor(ev), dId = eventDateOf(ev);
  const today = localDateId(), when = dId === today ? "Today" : dId === addDays(today, 1) ? "Tomorrow" : prettyDate(dId, true);
  const filled = crew ? crew.filter((x) => !x.open).length : 0;
  return `
    <div><div class="kicker">Next call · ${esc(when)}</div>
      <h1 class="headline">${esc(ev.opp)}</h1>
      ${venueOf(ev) ? `<div class="sub">${esc(venueOf(ev))}</div>` : ""}</div>
    <div class="grid">
      <div class="card hi"><div class="label">Crew call</div><div class="big">${esc(c.call || "Not set yet")}</div>
        ${c.gameTime ? `<div class="muted">Start ${esc(c.gameTime)}</div>` : ""}</div>
      <div class="card"><div class="label">Date</div><div class="big">${esc(prettyDate(dId))}</div>
        <div class="muted">${esc(ev.client || "")}</div></div>
      <div class="card"><div class="label">Crew</div><div class="big">${crew ? `${filled} of ${crew.length}` : "Not posted"}</div>
        <div class="muted">${crew ? "positions filled" : "Shift board not seeded yet"}</div></div>
    </div>
    ${crew && crew.length ? `<div class="card"><div class="label">On the call</div><div class="chips">
      ${crew.map((x) => x.open
        ? `<span class="chip open">${esc(x.role)} <span class="who">open</span></span>`
        : `<span class="chip">${esc(x.role)} <span class="who">${esc(x.name)}</span></span>`).join("")}
    </div></div>` : ""}`;
}

function slideWeek() {
  const list = upcoming().slice(0, 7);
  if (list.length < 2) return null;
  return `
    <div><div class="kicker">Coming up</div><h1 class="headline">On the schedule</h1></div>
    <div class="card"><div class="rows">
      ${list.map((ev) => {
        const c = callsFor(ev), crew = crewFor(ev);
        const fill = crew ? `${crew.filter((x) => !x.open).length}/${crew.length} crew` : "";
        return `<div class="row"><span class="l"><b>${esc(prettyDate(eventDateOf(ev)))}</b> · ${esc(ev.opp)}</span>
          <span class="r">${esc([c.call && "Call " + c.call, venueOf(ev), fill].filter(Boolean).join(" · "))}</span></div>`;
      }).join("")}
    </div></div>`;
}

function openShifts() {
  const out = [];
  upcoming().forEach((ev) => (crewFor(ev) || []).forEach((x) => { if (x.open) out.push({ ev, role: x.role }); }));
  return out;
}

function slideOpen() {
  const list = openShifts();
  if (!upcoming().length) return null;
  if (!list.length) {
    return `<div><div class="kicker">Open shifts</div><h1 class="headline">Every shift is covered</h1>
      <div class="sub">When one opens up it shows here first. Pick it up in Teams under Shifts.</div></div>`;
  }
  return `
    <div><div class="kicker">Open shifts · ${list.length}</div><h1 class="headline">Pick one up</h1>
      <div class="sub">Grab it in the Teams app under Shifts.</div></div>
    <div class="grid">
      ${list.slice(0, 6).map(({ ev, role }) => {
        const c = callsFor(ev);
        return `<div class="card"><span class="tag acc">Open</span>
          <div class="big" style="margin-top:10px">${esc(role)}</div>
          <div class="muted">${esc(prettyDate(eventDateOf(ev)))} · ${esc(ev.opp)}</div>
          ${c.call ? `<div class="muted">Call ${esc(c.call)}</div>` : ""}</div>`;
      }).join("")}
    </div>
    ${list.length > 6 ? `<div class="sub">${list.length - 6} more in the app.</div>` : ""}`;
}

function slideYours() {
  if (TV || !S.user || !S.profile || !S.profile.legalName) return null;
  const me = S.profile;
  let next = null;
  for (const ev of upcoming()) {
    const hit = (crewFor(ev) || []).find((x) => !x.open && namesMatch(x.name, me.legalName, me.crewHandle));
    if (hit) { next = { ev, role: hit.role }; break; }
  }
  // Your invoices, matched the same way My Invoices matches them.
  const mine = [];
  Object.entries(S.invoices || {}).forEach(([gameId, pushes]) => {
    Object.entries(pushes || {}).forEach(([key, inv]) => {
      if (inv && inv.name && namesMatch(inv.name, me.legalName, me.crewHandle)) mine.push({ gameId, key, ...inv });
    });
  });
  mine.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
  const statusOf = (inv) => {
    const pd = (S.paid[inv.gameId] || {})[roleKey(inv.position || "")];
    if (pd && pd.paid) return ["Paid", "good"];
    const ap = (S.approvals[inv.gameId] || {})[inv.key];
    if (ap && ap.quickbooksBillCreated) return ["In QuickBooks", "info"];
    return ["Submitted", ""];
  };
  const first = (me.crewHandle || me.legalName || "").split(" ")[0];
  return `
    <div><div class="kicker">Just for you</div><h1 class="headline">Hey ${esc(first)}</h1></div>
    <div class="grid">
      <div class="card hi"><div class="label">Your next shift</div>
        ${next ? `<div class="big">${esc(next.role)}</div>
          <div class="muted">${esc(prettyDate(eventDateOf(next.ev)))} · ${esc(next.ev.opp)}</div>
          ${callsFor(next.ev).call ? `<div class="muted">Call ${esc(callsFor(next.ev).call)}</div>` : ""}`
        : `<div class="big">None yet</div><div class="muted">Open shifts are in the app under Shifts.</div>`}
      </div>
      <div class="card"><div class="label">Your invoices</div>
        ${mine.length ? `<div class="rows">${mine.slice(0, 4).map((inv) => {
          const ev = allEvents().find((e) => e.id === inv.gameId);
          const [word, cls] = statusOf(inv);
          return `<div class="row"><span class="l">${esc(ev ? prettyDate(eventDateOf(ev)) : inv.gameId)} · ${esc(inv.position || "")}</span>
            <span class="tag ${cls}">${word}</span></div>`;
        }).join("")}</div>` : `<div class="muted">No invoices under your name yet.</div>`}
      </div>
    </div>`;
}

function slideGear() {
  if (!S.cables && !S.cases) return null;
  const cables = Object.entries(S.cables || {}).map(([id, c]) => ({ id, ...c, status: (c && c.status) || "good" }));
  const cases = Object.entries(S.cases || {}).map(([id, c]) => ({ id, ...c, state: (c && c.state) || "open" }));
  if (!cables.length && !cases.length) return null;
  const badCables = cables.filter((c) => c.status !== "good");
  const sealed = cases.filter((c) => c.state === "sealed").length;
  const broken = cases.filter((c) => c.state === "broken");
  const word = { bad: ["Bad", "bad"], repair: ["Repair", "info"] };
  return `
    <div><div class="kicker">Gear</div>
      <h1 class="headline">${badCables.length || broken.length ? "Gear to know about" : "Gear is good"}</h1></div>
    <div class="grid">
      <div class="card"><div class="label">Cables</div>
        <div class="big">${cables.length - badCables.length} of ${cables.length} good</div>
        ${badCables.length ? `<div class="rows" style="margin-top:8px">${badCables.slice(0, 5).map((c) => {
          const [w, cls] = word[c.status] || [c.status, ""];
          return `<div class="row"><span class="l">${esc(c.label || c.id)}${c.colour ? ` · ${esc(c.colour)}` : ""}</span><span class="tag ${cls}">${esc(w)}</span></div>`;
        }).join("")}</div>` : ""}
      </div>
      <div class="card"><div class="label">Cases</div>
        <div class="big">${sealed} of ${cases.length} sealed</div>
        ${broken.length ? `<div class="rows" style="margin-top:8px">${broken.slice(0, 5).map((c) =>
          `<div class="row"><span class="l">${esc(c.label || c.id)}</span><span class="tag bad">Seal broken</span></div>`).join("")}</div>` : ""}
      </div>
    </div>`;
}

function money(n) { return "$" + Math.round(Number(n) || 0).toLocaleString(); }

function slideBring() {
  const r = S.board.referrals || {};
  const hasNums = r.paidTotal != null || r.inProgress != null || r.booked != null;
  return `
    <div><div class="kicker">Crew program</div><h1 class="headline">Bring a show. Earn 10%.</h1>
      <div class="sub">You get 10% of the gross on the first booked and paid show you bring to ADV.</div></div>
    <div class="grid">
      ${hasNums ? `<div class="card hi"><div class="label">Paid to crew this season</div>
        <div class="money">${money(r.paidTotal)}</div>
        <div class="rows" style="margin-top:10px">
          <div class="row"><span class="l">Leads in progress</span><span class="tag">${esc(r.inProgress || 0)}</span></div>
          <div class="row"><span class="l">Booked, waiting on payment</span><span class="tag acc">${esc(r.booked || 0)}</span></div>
        </div></div>` : ""}
      <div class="card"><div class="label">How it works</div>
        <div class="steps">
          <div class="step"><b>1</b><span>Tell Dustin or Aracely about the show</span></div>
          <div class="step"><b>2</b><span>We quote it and book it</span></div>
          <div class="step"><b>3</b><span>The client pays</span></div>
          <div class="step"><b>4</b><span>Your 10% of the gross goes out</span></div>
        </div></div>
    </div>`;
}

function slideShout() {
  const list = Object.values(S.board.shoutouts || {}).filter((x) => x && x.quote)
    .sort((a, b) => (b.at || 0) - (a.at || 0));
  if (!list.length) return null;
  const s = list[0];
  return `
    <div><div class="kicker">Shout-out</div></div>
    <div class="card hi" style="padding:clamp(20px,3vw,56px)">
      <div class="quote">“${esc(s.quote)}”</div>
      ${s.from ? `<div class="sub">${esc(s.from)}</div>` : ""}
    </div>`;
}

function slideAcademy() {
  const url = (S.board.academy || {}).url;
  return `
    <div><div class="kicker">ADV Media Academy</div><h1 class="headline">Want to learn?</h1>
      <div class="sub">Hands-on training in live broadcast, audio, and video.${url ? " Scan to sign up." : " Ask Dustin or Aracely to get on the list."}</div></div>
    <div class="grid" style="grid-template-columns:${url ? "auto 1fr" : "1fr"}">
      ${url ? `<div class="card hi" style="text-align:center"><div class="qr" data-qr="${esc(url)}"></div>
        <div class="muted">Point your phone camera here</div></div>` : ""}
      <div class="card"><div class="label">Positions you can train for</div><div class="chips">
        ${TRADEABLE_ROLES.map((r) => `<span class="chip">${esc(r)}</span>`).join("")}
      </div></div>
    </div>`;
}

function slideSeason() {
  const today = localDateId();
  const all = allEvents().filter((e) => !e.cancelled);
  const done = all.filter((e) => eventDateOf(e) < today);
  if (!done.length) return null;
  const clients = new Set(done.map((e) => e.client).filter(Boolean));
  return `
    <div><div class="kicker">Season so far</div><h1 class="headline">${done.length} events in the books</h1></div>
    <div class="grid">
      <div class="card"><div class="label">Done</div><div class="money">${done.length}</div><div class="muted">events worked</div></div>
      <div class="card"><div class="label">Still ahead</div><div class="money">${all.length - done.length}</div><div class="muted">on the schedule</div></div>
      <div class="card"><div class="label">Clients</div><div class="money">${clients.size}</div><div class="muted">${esc([...clients].join(", "))}</div></div>
    </div>`;
}

const SLIDES = [slideNext, slideWeek, slideOpen, slideYours, slideGear, slideBring, slideShout, slideAcademy, slideSeason];

// ---------------------------------------------------------------------------
// Rotation. Content is rebuilt on every data change, but the rotation keeps
// its place so a write from a phone doesn't throw the TV back to slide one.
// ---------------------------------------------------------------------------
let current = [], idx = 0, timer = null, slideStart = 0;
const stage = document.getElementById("stage"), dotsEl = document.getElementById("dots");

function build() {
  const keepName = current[idx] && current[idx].name;
  current = SLIDES.map((fn) => { let h = null; try { h = fn(); } catch (e) { console.error(fn.name, e); } return h ? { name: fn.name, html: h } : null; }).filter(Boolean);
  const keep = current.findIndex((s) => s.name === keepName);
  idx = keep >= 0 ? keep : 0;
  stage.innerHTML = current.map((s, i) => `<section class="slide${i === idx ? " on" : ""}" data-name="${s.name}">${s.html}</section>`).join("");
  stage.querySelectorAll("[data-qr]").forEach((el) => {
    try { const q = qrcode(0, "M"); q.addData(el.dataset.qr); q.make(); el.innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); }
    catch (e) { el.outerHTML = `<div class="muted">${esc(el.dataset.qr)}</div>`; }
  });
  dotsEl.innerHTML = current.map((_, i) => `<button aria-label="Slide ${i + 1}" data-i="${i}"><i></i></button>`).join("");
  dotsEl.querySelectorAll("button").forEach((b) => b.onclick = () => go(+b.dataset.i));
  paintDots();
  buildTicker();
}

function paintDots() {
  const total = SLIDE_SECONDS * 1000;
  const done = Math.min(1, (Date.now() - slideStart) / total);
  dotsEl.querySelectorAll("i").forEach((el, i) => {
    el.style.transition = "none";
    el.style.width = i < idx ? "100%" : i === idx ? (done * 100) + "%" : "0";
    if (i === idx) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transition = `width ${Math.max(0, total * (1 - done))}ms linear`; el.style.width = "100%";
      }));
    }
  });
}

function go(i) {
  if (!current.length) return;
  idx = (i + current.length) % current.length;
  stage.querySelectorAll(".slide").forEach((el, j) => el.classList.toggle("on", j === idx));
  slideStart = Date.now();
  paintDots();
  clearTimeout(timer);
  timer = setTimeout(() => go(idx + 1), SLIDE_SECONDS * 1000);
}

function buildTicker() {
  const items = [];
  Object.values(S.board.announcements || {}).filter((a) => a && a.text)
    .sort((a, b) => (b.at || 0) - (a.at || 0)).forEach((a) => items.push(["News", a.text]));
  const open = openShifts().length;
  if (open) items.push(["Shifts", `${open} open shift${open === 1 ? "" : "s"} in Teams`]);
  const bad = Object.values(S.cables || {}).filter((c) => c && c.status && c.status !== "good");
  bad.slice(0, 3).forEach((c) => items.push(["Gear", `${c.label || "Cable"} marked ${c.status}`]));
  items.push(["Bonus", "Bring a show, earn 10% of the gross"]);
  if ((S.board.academy || {}).url) items.push(["Academy", "Want to learn? Scan the code when it comes up"]);
  const t = document.getElementById("ticker");
  t.innerHTML = items.map(([k, v]) => `<span><b>${esc(k)}</b>${esc(v)}</span>`).join("");
  t.style.setProperty("--tick-s", Math.max(30, items.length * 9) + "s");
}

let buildQueued = false;
function repaint() {
  if (buildQueued) return;
  buildQueued = true;
  requestAnimationFrame(() => {
    buildQueued = false; build();
    if (!timer) go(idx);
  });
}

// ---------------------------------------------------------------------------
// Data. Public nodes first, then the signed-in person's own.
// ---------------------------------------------------------------------------
function listen(path, slot) {
  db.ref(path).on("value", (snap) => { S[slot] = snap.val() || {}; repaint(); },
    (err) => { console.warn("Can't read " + path + ":", err && err.message); S[slot] = S[slot] || {}; repaint(); });
}
listen("liveRoster", "liveRoster");
listen("clientEvents", "clientEvents");
listen("gameOverrides", "gameOverrides");
listen("gameSettings", "gameSettings");
listen("cables", "cables");
listen("cases", "cases");
listen("crewBoard", "board");

let userRefs = [];
firebase.auth().onAuthStateChanged((u) => {
  userRefs.forEach((r) => r.off()); userRefs = [];
  S.user = u; S.profile = null; S.invoices = null; S.approvals = {}; S.paid = {};
  const admin = !!(u && ADMIN_EMAILS.includes(u.email));
  document.getElementById("editBtn").style.display = admin && !TV ? "" : "none";
  if (u && !TV) {
    const sub = (path, slot) => {
      const r = db.ref(path); userRefs.push(r);
      r.on("value", (s) => { S[slot] = s.val() || {}; repaint(); }, () => {});
    };
    sub(`profiles/${u.uid}`, "profile");
    sub("invoices", "invoices");
    sub("qbApprovals", "approvals");
    sub(`paidStatus/${u.uid}`, "paid");
  }
  repaint();
});

// ---------------------------------------------------------------------------
// Clock and weather.
// ---------------------------------------------------------------------------
function tickClock() {
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  document.getElementById("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  // Roll over at local midnight so "Today" and "Next call" move on their own.
  if (tickClock.day && tickClock.day !== localDateId()) repaint();
  tickClock.day = localDateId();
}
tickClock(); setInterval(tickClock, 15000);

const WX = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog",
  51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Rain", 63: "Rain", 65: "Heavy rain",
  71: "Snow", 73: "Snow", 75: "Snow", 80: "Showers", 81: "Showers", 82: "Heavy showers",
  95: "Thunderstorms", 96: "Thunderstorms", 99: "Thunderstorms" };
async function loadWeather() {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${STADIUM_LAT}&longitude=${STADIUM_LNG}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago`);
    const j = await r.json();
    const t = Math.round(j.current.temperature_2m), w = WX[j.current.weather_code] || "";
    document.getElementById("wx").textContent = `${t}°${w ? " " + w : ""} at the stadium`;
  } catch (e) { document.getElementById("wx").textContent = ""; }
}
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

// ---------------------------------------------------------------------------
// Admin editor. Writes only to crewBoard.
// ---------------------------------------------------------------------------
const edOv = document.getElementById("edOv"), ed = document.getElementById("ed");
document.getElementById("editBtn").onclick = () => { drawEditor(); edOv.classList.add("open"); };
edOv.onclick = (e) => { if (e.target === edOv) edOv.classList.remove("open"); };

function drawEditor(msg) {
  const b = S.board || {}, r = b.referrals || {}, a = b.academy || {};
  const ann = Object.entries(b.announcements || {}).sort((x, y) => (y[1].at || 0) - (x[1].at || 0));
  const sh = Object.entries(b.shoutouts || {}).sort((x, y) => (y[1].at || 0) - (x[1].at || 0));
  ed.innerHTML = `
    <h2>Edit crew board</h2>
    <div class="muted" style="font-size:13px">Everything else on the board comes from Teams on its own.</div>

    <div class="label">Ticker announcements</div>
    ${ann.map(([k, v]) => `<div class="item"><span>${esc(v.text)}</span><button class="x" data-del="announcements/${k}">Remove</button></div>`).join("") || `<div class="muted" style="font-size:13px">None yet.</div>`}
    <input id="annText" placeholder="CCU 2 back in service" maxlength="140" />
    <button class="btn save" id="annAdd">Add announcement</button>

    <div class="label">Shout-outs (newest one shows)</div>
    ${sh.map(([k, v]) => `<div class="item"><span>“${esc(v.quote)}” ${v.from ? "· " + esc(v.from) : ""}</span><button class="x" data-del="shoutouts/${k}">Remove</button></div>`).join("") || `<div class="muted" style="font-size:13px">None yet.</div>`}
    <textarea id="shQuote" placeholder="The replay package Friday was the best we've had."></textarea>
    <input id="shFrom" placeholder="Who said it" />
    <button class="btn save" id="shAdd">Add shout-out</button>

    <div class="label">Bring a show numbers</div>
    <div class="inline">
      <input id="rPaid" type="number" min="0" placeholder="Paid $" value="${r.paidTotal ?? ""}" />
      <input id="rProg" type="number" min="0" placeholder="In progress" value="${r.inProgress ?? ""}" />
      <input id="rBook" type="number" min="0" placeholder="Booked" value="${r.booked ?? ""}" />
    </div>
    <div class="muted" style="font-size:13px">Paid to crew this season, leads in progress, booked and waiting on payment. Leave all three blank to hide the numbers.</div>
    <button class="btn save" id="rSave">Save numbers</button>

    <div class="label">Academy sign-up link</div>
    <input id="acUrl" type="url" placeholder="https://advmediaco.com/academy" value="${esc(a.url || "")}" />
    <div class="muted" style="font-size:13px">The QR code points here. Leave blank and the slide asks people to talk to you instead.</div>
    <button class="btn save" id="acSave">Save link</button>

    <div class="msg" id="edMsg">${esc(msg || "")}</div>
    <button class="btn ghost" id="edClose" style="width:100%;margin-top:10px">Done</button>`;

  const done = (m) => drawEditor(m);
  const fail = (e) => { document.getElementById("edMsg").textContent = "Couldn't save: " + (e.message || e) + ". Check the crewBoard database rule."; };
  ed.querySelectorAll("[data-del]").forEach((x) => x.onclick = () =>
    db.ref("crewBoard/" + x.dataset.del).remove().then(() => done("Removed")).catch(fail));
  ed.querySelector("#annAdd").onclick = () => {
    const t = ed.querySelector("#annText").value.trim(); if (!t) return;
    db.ref("crewBoard/announcements").push({ text: t, at: Date.now() }).then(() => done("Added")).catch(fail);
  };
  ed.querySelector("#shAdd").onclick = () => {
    const q = ed.querySelector("#shQuote").value.trim(); if (!q) return;
    db.ref("crewBoard/shoutouts").push({ quote: q, from: ed.querySelector("#shFrom").value.trim(), at: Date.now() }).then(() => done("Added")).catch(fail);
  };
  ed.querySelector("#rSave").onclick = () => {
    const n = (id) => { const v = ed.querySelector(id).value.trim(); return v === "" ? null : Math.max(0, Number(v)); };
    db.ref("crewBoard/referrals").set({ paidTotal: n("#rPaid"), inProgress: n("#rProg"), booked: n("#rBook") }).then(() => done("Saved")).catch(fail);
  };
  ed.querySelector("#acSave").onclick = () => {
    const u = ed.querySelector("#acUrl").value.trim();
    db.ref("crewBoard/academy").set(u ? { url: u } : null).then(() => done("Saved")).catch(fail);
  };
  ed.querySelector("#edClose").onclick = () => edOv.classList.remove("open");
}
</script>
</body>
</html>
