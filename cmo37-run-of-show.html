<style>
  /* Layout: one screen, no scrolling to find the cue. Current item owns the
     middle, controls sit under the thumbs, the running order drops down over
     the top when you want it. Dark first, because it lives at a desk in a
     dark ballroom. */
  /* Colors read off the client's mark: the iridescent ramp runs magenta to
     violet to periwinkle to cyan on near-black. b1 b2 b3 are that ramp and
     carry the gradient; the states borrow from it rather than inventing a
     red or a green that is not in the brand. */
  :root {
    --b1: #F1B2F9;
    --b2: #C9BDFF;
    --b3: #9CDEFF;
    --go-text: #0B0C10;
    --bg: #0B0C10;
    --panel: #14161D;
    --panel-2: #1B1E27;
    --line: #2A2E3A;
    --text: #ECEEF5;
    --muted: #99A0B0;
    --faint: #6A7183;
    --accent: #9CDEFF;
    --accent-soft: rgba(156, 222, 255, 0.14);
    --live: #9CDEFF;
    --hold: #DFC2FF;
    --over: #F1B2F9;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --b1: #B23FC0; --b2: #6B4FC8; --b3: #1E86B8; --go-text: #FFFFFF;
      --bg: #F7F6FB; --panel: #FFFFFF; --panel-2: #F1F0F8; --line: #DDDAEA;
      --text: #15171F; --muted: #5C6273; --faint: #8A90A3; --accent: #1E86B8;
      --accent-soft: rgba(30, 134, 184, 0.12); --live: #0E6E9A; --hold: #6B4FC8;
      --over: #9B2FA8; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --b1: #B23FC0; --b2: #6B4FC8; --b3: #1E86B8; --go-text: #FFFFFF;
    --bg: #F7F6FB; --panel: #FFFFFF; --panel-2: #F1F0F8; --line: #DDDAEA;
    --text: #15171F; --muted: #5C6273; --faint: #8A90A3; --accent: #1E86B8;
    --accent-soft: rgba(30, 134, 184, 0.12); --live: #0E6E9A; --hold: #6B4FC8;
    --over: #9B2FA8; color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.35;
    -webkit-text-size-adjust: 100%; overflow: hidden;
  }
  .screen {
    height: 100%; display: flex; flex-direction: column; gap: 10px;
    padding-block: 10px 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; max-width: 1400px; margin: 0 auto; width: 100%;
  }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tag {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--muted);
  }

  /* top */
  .top { display: flex; align-items: center; gap: 12px; flex: none; }
  .top .name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .clock { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--faint);
    display: inline-block; flex: none;
  }
  .dot.on { background: var(--live); }
  .dot.local { background: var(--hold); }

  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px;
    cursor: pointer; font-size: 14px; min-height: 42px;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.small { min-height: 34px; padding: 5px 10px; font-size: 12.5px; }

  /* the cue */
  .cue {
    position: relative;
    flex: 1 1 auto; min-height: 0; background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 20px 16px 24px; display: flex;
    flex-direction: column; gap: 8px; overflow: hidden;
  }
  /* the mark's ramp, standing on its end */
  .cue::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, var(--b1), var(--b2) 50%, var(--b3));
  }
  .cue .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .cue h1 {
    margin: 0; font-size: clamp(26px, 5.2vw, 52px); line-height: 1.05;
    letter-spacing: -0.025em; text-wrap: balance;
  }
  .cue .sub {
    margin: 0; color: var(--muted); font-size: clamp(14px, 1.8vw, 19px);
    line-height: 1.3; overflow: hidden;
  }
  .after { margin-top: 14px; display: grid; gap: 6px; align-content: start; min-height: 0; }
  .after div {
    display: grid; grid-template-columns: 78px 1fr; gap: 12px; align-items: baseline;
    color: var(--faint); font-size: 13.5px; min-width: 0;
  }
  .after .wt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .after .wn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .readouts {
    margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch;
  }
  .read {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 14px; flex: 1 1 150px; min-width: 0;
  }
  .read b {
    display: block; font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: clamp(24px, 4.4vw, 42px); line-height: 1.1; letter-spacing: -0.02em;
  }
  .read.over b { color: var(--over); }
  .read.hold b { color: var(--hold); }

  /* next */
  .next {
    flex: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 10px 14px; display: flex; gap: 14px;
    align-items: baseline; min-width: 0;
  }
  .next .t { font-weight: 600; font-size: 15px; }
  .next .p { color: var(--muted); font-size: 13.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

  /* controls */
  .controls { flex: none; display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 9px; }
  .controls button { min-height: 58px; font-size: 16px; font-weight: 600; }
  .controls .go {
    background: linear-gradient(100deg, var(--b1), var(--b2) 55%, var(--b3));
    border-color: transparent; color: var(--go-text); font-size: 19px;
  }
  .controls .holding {
    background: var(--hold); border-color: var(--hold); color: var(--go-text);
    background-image: none;
  }

  /* running order */
  .list {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    padding-block: 12px 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto; display: flex; flex-direction: column; gap: 7px;
  }
  /* a class selector beats the browser's own [hidden] rule, so say it here */
  .list[hidden] { display: none; }
  .list .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .item {
    display: grid; grid-template-columns: 82px 1fr auto; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; min-width: 0;
  }
  .item.cur { border-color: var(--accent); background: var(--accent-soft); }
  .item.past { opacity: 0.5; }
  .item .w { min-width: 0; }
  .item .ti { font-weight: 600; font-size: 14.5px; }
  .item .pi { color: var(--muted); font-size: 12.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .item .cl { font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .pairmark { color: var(--accent); }

  .hint { color: var(--faint); font-size: 12px; }

  /* the strip that says who is driving, and how long before this device
     goes back to following them */
  .banner {
    flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--b2);
    border-radius: 10px; padding: 8px 13px; font-size: 13px; color: var(--muted);
  }
  .banner b { color: var(--text); font-weight: 650; }
  .banner .count {
    margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums;
    color: var(--b2); font-weight: 700;
  }
  .banner[hidden] { display: none; }

  .codebar { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .codebar[hidden] { display: none; }
  .codebar input {
    font: inherit; font-family: var(--mono); font-size: 20px; letter-spacing: 0.3em;
    width: 7ch; text-align: center; padding: 9px 10px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  }
  .codebar .msg { font-size: 13px; color: var(--over); flex: 1; min-width: 120px; }

  .controls.follow { grid-template-columns: 1fr; }
  .controls[hidden], .controls.follow[hidden] { display: none; }
  .item.viewing { border-color: var(--b2); }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <span class="dot" id="dot"></span>
    <a class="name" href="corporate.html" style="color:inherit; text-decoration:none;"
       title="Back to Corporate">&#8249; CMO37 &middot; Day One</a>
    <span class="tag" id="mode"></span>

  <div class="cue">

<div class="list" id="list" hidden>

    <span class="tag">Running order &middot; Day One, October 15</span>
    <button class="small" id="closeList" style="margin-left:auto">Close</button>
  </div>
  <div id="items"></div>
  <p class="hint" id="listHint"></p>
  <button class="small" id="resetShow" hidden style="align-self:flex-start">Reset the show to the top</button>
</div>

<script>
(function () {
  "use strict";

  // The day, exactly as the Assembly at a Glance sheet lists it.
  const DAY = [
    { s: "9:30 AM",  e: "11:00 AM", t: "Registration and Snacks", p: "Doors open, snacks out" },
    { s: "11:00 AM", e: "11:55 AM", t: "AI Power Hours 1 and 2", pair: true,
      p: "Room 1: Branding and AI · Room 2: Leading AI Adoption: The Power of Communication, Positioning, and Influence" },
    { s: "12:05 PM", e: "12:50 PM", t: "Opening Vendor Keynote",
      p: "From Data Silos to Revenue Growth: How AI-First CRM Is Redefining Growth Marketing for B2C Brands" },
    { s: "12:55 PM", e: "1:25 PM", t: "Workshop 1",
      p: "The Whole Argument: The Race Is Won Before the Answer Appears" },
    { s: "1:30 PM", e: "2:00 PM", t: "Workshop 2",
      p: "The AI-Powered CMO: Turning Audience Intelligence into Strategic Advantage" },
    { s: "2:05 PM", e: "2:35 PM", t: "Workshop 3",
      p: "Addressing Waning Public Confidence: Opportunities and Limits for CCOs" },
    { s: "2:40 PM", e: "3:10 PM", t: "Workshop 4",
      p: "Brand Fidelity Through Growth and AI: Why Every Brand Needs a System for Type" },
    { s: "3:20 PM", e: "4:05 PM", t: "Afternoon Vendor Keynote",
      p: "The Full-Funnel Creator Strategy for the AI Search Era" },
    { s: "4:10 PM", e: "4:40 PM", t: "Workshop 5",
      p: "The Small Moments That Carry the Brand: Why Customers Judge the Whole Brand by a Handful of Everyday Interactions" },
    { s: "4:45 PM", e: "5:15 PM", t: "Workshop 6", p: "Owning the Second Layer of AI Search" },
    { s: "5:20 PM", e: "5:50 PM", t: "Workshop 7",
      p: "2026's Buzziest Consumer Product Launches, as Revealed by Verified Buyers" },
    { s: "5:55 PM", e: "6:25 PM", t: "Workshop 8",
      p: "The New CMO: Leading Growth Beyond the Marketing Function" },
    { s: "6:30 PM", e: "7:30 PM", t: "Cocktail Hour", p: "Reception" },
    { s: "7:30 PM", e: "8:45 PM", t: "Dinner and Game Show", p: "Dinner service, then the game show" }
  ];

  const $ = function (id) { return document.getElementById(id); };

  function mins(str) {
    const m = /^(\d+):(\d+)\s*(AM|PM)$/i.exec(str.trim());
    let h = parseInt(m[1], 10);
    const mi = parseInt(m[2], 10);
    if (m[3].toUpperCase() === "PM" && h !== 12) h += 12;
    if (m[3].toUpperCase() === "AM" && h === 12) h = 0;
    return h * 60 + mi;
  }
  function durMin(b) { return mins(b.e) - mins(b.s); }
  function esc(t) {
    return String(t == null ? "" : t).replace(/&/g, "&amp;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mmss(ms) {
    const neg = ms < 0;
    let s = Math.floor(Math.abs(ms) / 1000);
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const core = (h ? h + ":" + String(m).padStart(2, "0") : String(m)) +
      ":" + String(s).padStart(2, "0");
    return (neg ? "-" : "") + core;
  }

  // ---- one driver, everyone else follows ---------------------------------
  // The show's position lives in the database, not on a device. One person
  // holds control by entering the code; every other device reads the same
  // record and shows the same cue and the same clock.
  //
  // Following takes no sign-in, because runOfShow is public to read. Taking
  // control needs a Firebase account as well as the code, because writing
  // there needs one. That is deliberate: the code on its own is not access.
  //
  // A follower can look wherever they like. Ten seconds after they stop
  // touching the screen it goes back to whatever the producer is calling.
  const CONTROL_CODE = "5150";
  const SHOW_PATH = "runOfShow/corporate-cmo37";
  const CONTROL_STALE = 45000;   // a controller who stops breathing
  const BEAT = 10000;            // how often the controller says it is alive
  const SNAP_BACK = 10000;       // a follower's leash

  let S = { i: 0, status: "standby", startedAt: 0, heldAt: 0 };
  let control = { by: "", name: "", at: 0 };
  let fb = null, stateRef = null, controlRef = null;
  let signedIn = null, online = false;
  let localView = null, browseUntil = 0;

  const ME = (function () {
    try {
      let v = localStorage.getItem("advRosDevice");
      if (!v) { v = String(Date.now()) + Math.random().toString(36).slice(2, 8); 
                localStorage.setItem("advRosDevice", v); }
      return v;
    } catch (e) { return String(Date.now()) + Math.random().toString(36).slice(2, 8); }
  })();

  function controlLive() { return !!control.by && Date.now() - (control.at || 0) < CONTROL_STALE; }
  function amController() { return controlLive() && control.by === ME; }
  function viewIndex() {
    return (!amController() && localView !== null) ? localView : S.i;
  }

  function paintConn() {
    const d = $("dot"), m = $("mode");
    if (!fb || !online) { d.className = "dot local"; m.textContent = "This device only"; return; }
    d.className = "dot on";
    if (amController()) m.textContent = "You are driving";
    else if (controlLive()) m.textContent = "Following " + (control.name || "the producer");
    else m.textContent = "Nobody driving";
  }

  function push() {
    if (!stateRef || !amController()) return;
    stateRef.set({ i: S.i, status: S.status, startedAt: S.startedAt,
                   heldAt: S.heldAt, at: Date.now() });
  }

  function adopt(o) {
    if (!o || typeof o.i !== "number") return;
    S = {
      i: Math.max(0, Math.min(DAY.length - 1, o.i)),
      status: o.status === "running" || o.status === "hold" ? o.status : "standby",
      startedAt: Number(o.startedAt) || 0,
      heldAt: Number(o.heldAt) || 0
    };
    render();
  }

  (function connect() {
    try {
      // FIREBASE_CONFIG is a top level const in its own script tag, which puts
      // it in the global lexical scope and NOT on window. Reaching for
      // window.FIREBASE_CONFIG finds nothing and silently drops to local mode.
      if (!window.firebase || typeof FIREBASE_CONFIG === "undefined") { paintConn(); return; }
      firebase.initializeApp(FIREBASE_CONFIG);
      fb = firebase.database();
      stateRef = fb.ref(SHOW_PATH + "/state");
      controlRef = fb.ref(SHOW_PATH + "/control");

      firebase.auth().onAuthStateChanged(function (u) { signedIn = u || null; paintConn(); render(); });
      fb.ref(".info/connected").on("value", function (sn) { online = !!sn.val(); paintConn(); });
      stateRef.on("value", function (sn) { const v = sn.val(); if (v) adopt(v); });
      controlRef.on("value", function (sn) {
        control = sn.val() || { by: "", name: "", at: 0 };
        paintConn(); render();
      });
    } catch (e) { fb = null; paintConn(); }
  })();

  // The controller says it is still here. If it stops, the chair opens up.
  setInterval(function () {
    if (controlRef && amController()) controlRef.update({ at: Date.now() });
  }, BEAT);

  function takeControl(code) {
    if (code !== CONTROL_CODE) return "That is not the code.";
    if (!fb || !online) return "No connection, so there is nothing to take.";
    if (!signedIn) return "Sign in on Home first, then come back to this page.";
    controlRef.set({
      by: ME,
      name: signedIn.displayName || signedIn.email || "Producer",
      at: Date.now()
    });
    localView = null; browseUntil = 0;
    return null;
  }
  function releaseControl() {
    if (controlRef && amController()) controlRef.set({ by: "", name: "", at: 0 });
  }

  // ---- actions (controller only) -----------------------------------------
  function goTo(i, run) {
    if (!amController() && fb && online) return;
    S.i = Math.max(0, Math.min(DAY.length - 1, i));
    S.status = run ? "running" : "standby";
    S.startedAt = run ? Date.now() : 0;
    S.heldAt = 0;
    render(); push();
  }
  function primary() {
    if (!amController() && fb && online) return;
    if (S.status === "standby") { goTo(S.i, true); return; }
    if (S.status === "hold") { toggleHold(); return; }
    goTo(S.i + 1, true);
  }
  function toggleHold() {
    if (!amController() && fb && online) return;
    if (S.status === "running") { S.status = "hold"; S.heldAt = Date.now(); }
    else if (S.status === "hold") {
      S.startedAt += Date.now() - (S.heldAt || Date.now());
      S.status = "running"; S.heldAt = 0;
    } else return;
    render(); push();
  }
  // Puts this cue's clock back to zero without moving off it.
  function resetCue() {
    if (!amController() && fb && online) return;
    S.status = "standby"; S.startedAt = 0; S.heldAt = 0;
    render(); push();
  }
  function resetShow() {
    if (!amController() && fb && online) return;
    S = { i: 0, status: "standby", startedAt: 0, heldAt: 0 };
    localView = null; browseUntil = 0;
    $("list").hidden = true;
    render(); push();
  }

  $("go").addEventListener("click", primary);
  $("hold").addEventListener("click", toggleHold);
  $("back").addEventListener("click", function () { goTo(S.i - 1, false); });
  $("reset").addEventListener("click", resetCue);
  $("resetShow").addEventListener("click", resetShow);
  $("openList").addEventListener("click", function () { $("list").hidden = false; paintList(); });
  $("closeList").addEventListener("click", function () { $("list").hidden = true; });

  // ---- taking the chair ---------------------------------------------------
  function showCode(on) {
    $("codebar").hidden = !on;
    $("codeMsg").textContent = "";
    if (on) { $("codeIn").value = ""; $("codeIn").focus(); }
  }
  $("takeBtn").addEventListener("click", function () {
    if (amController()) { releaseControl(); return; }
    showCode(true);
  });
  $("codeCancel").addEventListener("click", function () { showCode(false); });
  $("codeGo").addEventListener("click", function () {
    const why = takeControl($("codeIn").value.trim());
    if (why) { $("codeMsg").textContent = why; return; }
    showCode(false); render();
  });
  $("codeIn").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") $("codeGo").click();
  });

  // ---- a follower looking around -----------------------------------------
  function touched() {
    if (amController()) return;
    if (!fb || !online || !controlLive()) return;
    browseUntil = Date.now() + SNAP_BACK;
  }
  ["pointerdown", "wheel", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, touched, { passive: true, capture: true });
  });

  function snapBack() {
    browseUntil = 0; localView = null;
    $("list").hidden = true;
    render();
  }

  document.addEventListener("keydown", function (ev) {
    if ((ev.target.tagName || "").toLowerCase() === "input") return;
    if (ev.key === "Escape") { $("list").hidden = true; return; }
    if (!amController() && fb && online) return;
    if (ev.key === " ") { ev.preventDefault(); primary(); }
    else if (ev.key === "h" || ev.key === "H") toggleHold();
    else if (ev.key === "ArrowLeft") goTo(S.i - 1, false);
    else if (ev.key === "ArrowRight") goTo(S.i + 1, false);
  });

  // Installed to the home screen there is no browser chrome to escape, so the
  // button has nothing to do and the phone's own full screen notice never
  // appears. In a tab it still works, with that notice, which belongs to the
  // browser and cannot be dismissed from here.
  const standalone = (window.matchMedia &&
      window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) ||
    window.navigator.standalone === true;
  if (standalone) {
    $("fs").hidden = true;
  } else {
    $("fs").addEventListener("click", function () {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { $("fs").textContent = "Add to Home Screen"; return; }
      try {
        Promise.resolve(req.call(el)).catch(function () {
          $("fs").textContent = "Add to Home Screen";
        });
      } catch (e) { $("fs").textContent = "Add to Home Screen"; }
    });
  }

  // Keep the screen awake while the page is up. Refused is fine.
  let lock = null;
  async function wake() {
    try {
      if (navigator.wakeLock && !lock) lock = await navigator.wakeLock.request("screen");
    } catch (e) { lock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { lock = null; wake(); }
  });
  wake();

  // ---- render ------------------------------------------------------------
  function elapsedMs() {
    if (S.status === "running") return Date.now() - S.startedAt;
    if (S.status === "hold") return (S.heldAt || Date.now()) - S.startedAt;
    return 0;
  }

  function render() {
    const idx = viewIndex();
    const onLive = idx === S.i;
    const b = DAY[idx];
    const n = DAY[idx + 1];
    const driving = amController() || !fb || !online;

    $("cueNo").textContent = "Cue " + (idx + 1) + " of " + DAY.length +
      (b.pair ? " · two rooms" : "");
    $("cueSched").textContent = b.s + " to " + b.e + " · " + durMin(b) + " min";
    $("cueState").textContent = !onLive ? "Looking ahead"
      : S.status === "running" ? "Running" : S.status === "hold" ? "Holding" : "Standby";
    $("cueState").style.color = !onLive ? "var(--b2)"
      : S.status === "running" ? "var(--live)" : S.status === "hold" ? "var(--hold)" : "";
    $("cueTitle").textContent = b.t;
    $("cueSub").textContent = b.p || "";

    // what is coming after next, so the caller is not guessing
    $("after").innerHTML = DAY.slice(idx + 2, idx + 5).map(function (x) {
      return '<div><span class="wt">' + esc(x.s) + '</span><span class="wn">' +
        esc(x.t) + (x.p ? " · " + esc(x.p) : "") + "</span></div>";
    }).join("");

    $("nextTime").textContent = n ? n.s : "—";
    $("nextTitle").textContent = n ? n.t + (n.p ? " · " + n.p : "") : "End of day";

    // Only the person driving gets the controls. Everyone else gets the way
    // to take them.
    $("controls").hidden = !driving;
    $("followBar").hidden = driving;
    $("reset").hidden = !driving;
    $("resetShow").hidden = !driving;
    $("takeBtn").textContent = controlLive() && !amController()
      ? "Take control from " + (control.name || "the producer") : "Take control";

    if (driving) {
      $("go").textContent = S.status === "standby" ? "Start"
        : S.status === "hold" ? "Resume" : (n && S.i + 1 < DAY.length ? "Next" : "End");
      $("go").disabled = S.status === "running" && S.i + 1 >= DAY.length;
      $("hold").textContent = S.status === "hold" ? "Holding" : "Hold";
      $("hold").classList.toggle("holding", S.status === "hold");
      $("hold").disabled = S.status === "standby";
      $("back").disabled = S.i === 0;
    }

    paintBanner();
    tickReadouts();
    if (!$("list").hidden) paintList();
  }

  // Says who is driving and, when this device has wandered off, how long
  // until it goes back to them.
  function paintBanner() {
    const el = $("banner");
    if (amController() || !fb || !online) { el.hidden = true; return; }
    if (!controlLive()) {
      el.hidden = false;
      el.innerHTML = "Nobody is driving. The clock is whatever was left on it.";
      return;
    }
    const who = esc(control.name || "the producer");
    if (browseUntil) {
      const left = Math.max(0, Math.ceil((browseUntil - Date.now()) / 1000));
      el.hidden = false;
      el.innerHTML = "Looking around. Back to <b>" + who + "</b> in" +
        '<span class="count">' + left + "s</span>";
    } else {
      el.hidden = false;
      el.innerHTML = "Following <b>" + who + "</b>";
    }
  }

  function tickReadouts() {
    const idx = viewIndex();
    const onLive = idx === S.i;
    const b = DAY[idx];
    const el = onLive ? elapsedMs() : 0;
    if (!onLive) {
      // Looking at a cue that is not the one being called: no clock to show.
      $("rElapsed").className = "read";
      $("rElapsed").querySelector("b").textContent = "—";
      $("rElapsed").querySelector(".tag").textContent = "Not the live cue";
      $("rLeft").className = "read";
      $("rLeft").querySelector("b").textContent = mmss(durMin(b) * 60000);
      $("rLeft").querySelector(".tag").textContent = "Block length";
      $("rPlan").className = "read";
      $("rPlan").querySelector("b").textContent = DAY[S.i].t;
      $("rPlan").querySelector(".tag").textContent = "Live cue";
      return;
    }
    $("rElapsed").querySelector(".tag").textContent = "Elapsed";
    const planned = durMin(b) * 60000;

    $("rElapsed").querySelector("b").textContent = S.status === "standby" ? "0:00" : mmss(el);
    $("rElapsed").className = "read" + (S.status === "hold" ? " hold" : "");

    const left = planned - el;
    const lw = $("rLeft");
    if (S.status === "standby") {
      lw.querySelector("b").textContent = mmss(planned);
      lw.querySelector(".tag").textContent = "Block length";
      lw.className = "read";
    } else if (left >= 0) {
      lw.querySelector("b").textContent = mmss(left);
      lw.querySelector(".tag").textContent = "Left in block";
      lw.className = "read";
    } else {
      lw.querySelector("b").textContent = mmss(-left);
      lw.querySelector(".tag").textContent = "Over the block";
      lw.className = "read over";
    }

    // Where the day sits against the printed sheet.
    const pw = $("rPlan");
    if (S.status === "standby" || !S.startedAt) {
      pw.querySelector("b").textContent = "—";
      pw.querySelector(".tag").textContent = "Against plan";
      pw.className = "read";
    } else {
      const d = new Date(S.startedAt);
      const startedMin = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
      const off = Math.round(startedMin - mins(b.s));
      if (Math.abs(off) >= 60) {
        // An hour out either way means the item was called off the sheet
        // entirely. The clock time it actually started is the useful fact.
        let hh = d.getHours();
        const ap = hh >= 12 ? "PM" : "AM";
        hh = hh % 12 || 12;
        pw.querySelector("b").textContent =
          hh + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
        pw.querySelector(".tag").textContent = "Actually started";
        pw.className = "read";
      } else {
        pw.querySelector("b").textContent =
          off === 0 ? "On plan" : (off > 0 ? "+" : "−") + Math.abs(off) + " min";
        pw.querySelector(".tag").textContent =
          off === 0 ? "Against plan" : off > 0 ? "After plan" : "Ahead of plan";
        pw.className = "read" + (off > 5 ? " over" : "");
      }
    }
  }

  function paintList() {
    const driving = amController() || !fb || !online;
    const viewing = viewIndex();
    $("listHint").textContent = driving
      ? "Go puts the whole crew on that item. Space starts or advances, H holds."
      : "View shows you that item on this device only. It goes back to the producer ten seconds after you stop touching it.";
    $("items").innerHTML = DAY.map(function (b, i) {
      const cls = (i === S.i ? " cur" : (i < S.i ? " past" : "")) +
        (!driving && i === viewing && i !== S.i ? " viewing" : "");
      return '<div class="item' + cls + '">' +
        '<div class="cl">' + esc(b.s) + "<br>" + durMin(b) + " min</div>" +
        '<div class="w"><div class="ti">' + esc(b.t) +
        (b.pair ? ' <span class="pairmark">two rooms</span>' : "") +
        (i === S.i ? ' <span class="pairmark">live</span>' : "") + "</div>" +
        '<div class="pi">' + esc(b.p || "") + "</div></div>" +
        '<button class="small" data-go="' + i + '">' + (driving ? "Go" : "View") + "</button></div>";
    }).join("");
    Array.prototype.forEach.call($("items").querySelectorAll("[data-go]"), function (bt) {
      bt.addEventListener("click", function () {
        const i = parseInt(bt.getAttribute("data-go"), 10);
        if (driving) { goTo(i, true); $("list").hidden = true; return; }
        localView = i;
        browseUntil = Date.now() + SNAP_BACK;
        $("list").hidden = true;
        render();
      });
    });
  }

  function clock() {
    const d = new Date();
    let h = d.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    $("clock").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
  }

  render();
  clock();
  setInterval(function () {
    // The leash: ten seconds after a follower stops touching the screen it
    // goes back to the cue being called.
    if (!amController() && browseUntil && Date.now() > browseUntil) { snapBack(); return; }
    tickReadouts();
    paintBanner();
    clock();
  }, 1000);
})();
</script>
</body>
</html>
